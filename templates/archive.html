{% extends "base.html" %}

{% block content %}
<header>
    <h2>Tags</h2>
</header>
  {% set section = get_section(path="blog/_index.md") %}
  {% for month, posts in section.pages
    | sort(attribute="date")
    | reverse
    | group_by(attribute="month") %}
  {% endfor %}
{% endblock content %}
